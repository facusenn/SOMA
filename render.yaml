services:
  - type: web
    name: soma
    runtime: node
    plan: free
    rootDir: soma-svelte
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    buildFilter:
      paths:
        - soma-svelte/**
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PROTOCOL_HEADER
        value: x-forwarded-proto
      - key: BODY_SIZE_LIMIT
        value: 25M
      - key: OPENROUTER_API_KEY
        sync: false
